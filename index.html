<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FX Signals</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --buy: #22c55e;
    --sell: #ef4444;
    --no-trade: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px 32px;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0 12px;
  }
  h1 { font-size: 1.3rem; margin: 0; }
  #pair { color: var(--muted); font-size: 0.9rem; }
  button#refresh {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.9rem;
  }
  button#refresh:active { opacity: 0.7; }
  #status { color: var(--muted); font-size: 0.8rem; padding-bottom: 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .tf { font-weight: 600; font-size: 1rem; }
  .regime { color: var(--muted); font-size: 0.8rem; }
  .signal {
    font-weight: 700;
    font-size: 1.1rem;
    padding: 2px 10px;
    border-radius: 8px;
    display: inline-block;
  }
  .signal.BUY { background: rgba(34,197,94,0.15); color: var(--buy); }
  .signal.SELL { background: rgba(239,68,68,0.15); color: var(--sell); }
  .signal.NOTRADE { background: rgba(100,116,139,0.15); color: var(--no-trade); }
  .risk-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    margin: 10px 0;
    font-size: 0.9rem;
  }
  .risk-row div span { color: var(--muted); }
  details { margin-top: 8px; font-size: 0.85rem; color: var(--muted); }
  summary { cursor: pointer; color: var(--text); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin-bottom: 3px; }
  .error { color: var(--sell); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>FX Signals</h1>
    <div id="pair">—</div>
  </div>
  <button id="refresh">Refresh</button>
</header>
<div id="status">Loading…</div>
<div id="results"></div>

<script>
async function load() {
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const pairEl = document.getElementById('pair');
  statusEl.textContent = 'Loading…';
  try {
    const res = await fetch('https://trading-ai-bot-marks-projects-a0532bf7.vercel.app/api/analyze', { cache: 'no-store' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    pairEl.textContent = data.pair;
    resultsEl.innerHTML = '';
    for (const r of data.results) {
      resultsEl.appendChild(renderCard(r));
    }
    statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    statusEl.textContent = '';
    resultsEl.innerHTML = '<div class="card error">Failed to load: ' + e.message + '</div>';
  }
}

function renderCard(r) {
  const card = document.createElement('div');
  card.className = 'card';
  if (r.error) {
    card.innerHTML = `<div class="card-top"><span class="tf">${r.timeframe}</span></div><div class="error">${r.error}</div>`;
    return card;
  }
  const sigClass = r.signal === 'NO TRADE' ? 'NOTRADE' : r.signal;
  let html = `
    <div class="card-top">
      <span class="tf">${r.timeframe}</span>
      <span class="regime">${r.regime}</span>
    </div>
    <span class="signal ${sigClass}">${r.signal}</span>
  `;
  if (r.signal !== 'NO TRADE') {
    html += `
      <div class="risk-row">
        <div><span>Entry </span>${r.entry.toFixed(5)}</div>
        <div><span>Confidence </span>${r.confidence}</div>
        <div><span>Stop-loss </span>${r.stop_loss.toFixed(5)}</div>
        <div><span>R:R </span>1:${r.risk_reward.toFixed(2)}</div>
        <div><span>Take-profit </span>${r.take_profit.toFixed(5)}</div>
      </div>
    `;
  }
  html += `
    <details>
      <summary>Reasoning</summary>
      <ul>${r.reasoning.map(x => `<li>${x}</li>`).join('')}</ul>
    </details>
  `;
  if (r.caveats && r.caveats.length) {
    html += `
      <details>
        <summary>Caveats</summary>
        <ul>${r.caveats.map(x => `<li>${x}</li>`).join('')}</ul>
      </details>
    `;
  }
  card.innerHTML = html;
  return card;
}

document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
